<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            background: #000000;
            user-select: none;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            color: #ffffff;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 3px; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div id="root" class="w-full max-w-xl"></div>

    <script type="text/babel">
        function App() {
            const [url, setUrl] = React.useState('');
            const [format, setFormat] = React.useState('mp3');
            const [playlist, setPlaylist] = React.useState('no');
            const [browser, setBrowser] = React.useState('none');
            const [dest, setDest] = React.useState('/Users/Shared');
            
            const [videoInfo, setVideoInfo] = React.useState(null);
            const [loadingInfo, setLoadingInfo] = React.useState(false);

            const [status, setStatus] = React.useState('idle'); 
            const [progress, setProgress] = React.useState(0);
            const [logMessage, setLogMessage] = React.useState('');
            const [currentTime, setCurrentTime] = React.useState('');
            const [isPaused, setIsPaused] = React.useState(false);

            React.useEffect(() => {
                const now = new Date();
                const options = { day: 'numeric', month: 'short' };
                const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
                setCurrentTime(`${now.toLocaleDateString('en-US', options)} at ${timeStr}`);

                fetch('/api/config')
                    .then(res => res.json())
                    .then(data => {
                        if (data.defaultDir) setDest(data.defaultDir);
                    })
                    .catch(() => {});
            }, []);

            const handleUrlChange = (newUrl) => {
                setUrl(newUrl);
                if (newUrl.length > 5 && (newUrl.includes('youtube.com') || newUrl.includes('youtu.be') || newUrl.includes('spotify.com'))) {
                    setLoadingInfo(true);
                    fetch(`/api/info?url=${encodeURIComponent(newUrl)}`)
                        .then(res => res.json())
                        .then(data => {
                            if (!data.error) setVideoInfo(data);
                            setLoadingInfo(false);
                        })
                        .catch(() => setLoadingInfo(false));
                }
            };

            const startDownload = (e) => {
                e.preventDefault();
                if (!url) return;

                setStatus('downloading');
                setProgress(0);
                setIsPaused(false);
                setLogMessage('Connecting to media streams...');

                const params = new URLSearchParams({ url, format, playlist, browser, dest });
                const eventSource = new EventSource(`/api/download?${params.toString()}`);

                eventSource.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if (data.type === 'progress') {
                        if (data.percent !== null) setProgress(data.percent);
                        setLogMessage(data.message);
                    } else if (data.type === 'done') {
                        eventSource.close();
                        if (data.code === 0) {
                            setStatus('complete');
                            setLogMessage('Saved successfully to ' + dest);
                        } else if (data.code === -9 || data.code === 9 || data.code === 15) {
                            setStatus('idle');
                            setLogMessage('Download cancelled.');
                        } else {
                            setStatus('error');
                            setLogMessage(data.error_msg || 'Download encountered an issue or was aborted.');
                        }
                    }
                };

                eventSource.onerror = () => {
                    eventSource.close();
                    if (status !== 'idle') {
                        setStatus('error');
                        setLogMessage('Lost connection to backend server.');
                    }
                };
            };

            const togglePause = () => {
                const endpoint = isPaused ? '/api/resume' : '/api/pause';
                fetch(endpoint).then(() => {
                    setIsPaused(!isPaused);
                    setLogMessage(isPaused ? 'Resuming download...' : 'Download paused.');
                });
            };

            const cancelDownload = () => {
                fetch('/api/cancel').then(() => {
                    setStatus('idle');
                    setIsPaused(false);
                    setLogMessage('');
                });
            };

            const openFolder = () => {
                fetch(`/api/open_folder?dest=${encodeURIComponent(dest)}`);
            };

            const isSpotify = url.includes('spotify.com');

            return (
                <div className="bg-[#1c1c1e] border border-white/20 rounded-2xl p-5 shadow-2xl text-slate-100">
                    <div className="flex items-center justify-between">
                        <div className="flex items-center space-x-3.5">
                            <div className={`w-10 h-10 rounded-xl flex items-center justify-center shadow-inner border border-white/20 flex-shrink-0 ${isSpotify ? 'bg-gradient-to-br from-green-500 to-emerald-800' : 'bg-gradient-to-br from-red-600 to-red-900'}`}>
                                <svg className="w-5 h-5 text-white" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                                </svg>
                            </div>
                            <div>
                                <h1 className="text-[15px] font-semibold tracking-tight text-white">Media Downloader Pro</h1>
                                <p className="text-xs text-slate-400 font-normal">{currentTime}</p>
                            </div>
                        </div>
                    </div>

                    {status === 'idle' && (
                        <form id="download-form" onSubmit={startDownload} className="mt-5 pt-4 border-t border-white/10 space-y-3">
                            <div>
                                <label className="block text-[11px] font-medium text-slate-400 mb-1">YouTube or Spotify Link</label>
                                <input type="text" value={url} onChange={e => handleUrlChange(e.target.value)} placeholder="Paste link here..." className="w-full px-3 py-2 bg-black/50 border border-white/10 rounded-xl focus:outline-none focus:border-blue-500 text-xs text-white placeholder-slate-500 transition-colors" required />
                            </div>

                            {loadingInfo && <div className="text-[11px] text-blue-400 text-center py-2 animate-pulse font-medium">Fetching media preview...</div>}

                            {videoInfo && !loadingInfo && (
                                <div className="flex items-center space-x-3 p-2.5 bg-black/40 border border-white/10 rounded-xl">
                                    <img src={videoInfo.thumbnail} alt="Thumbnail" className="w-20 h-12 object-cover rounded-lg flex-shrink-0 border border-white/10" />
                                    <div className="min-w-0 flex-1">
                                        <p className="text-[11px] font-semibold text-white truncate">{videoInfo.title}</p>
                                        <p className="text-[10px] text-slate-400 truncate mt-0.5">{videoInfo.uploader} • {videoInfo.duration}</p>
                                    </div>
                                </div>
                            )}

                            {!isSpotify && (
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="block text-[11px] font-medium text-slate-400 mb-1">Format</label>
                                        <select value={format} onChange={e => setFormat(e.target.value)} className="w-full px-3 py-1.5 bg-black/50 border border-white/10 rounded-xl text-xs text-slate-200 focus:outline-none focus:border-blue-500">
                                            <option value="mp3" className="bg-slate-900">MP3 (Audio 320kbps)</option>
                                            <option value="mp4" className="bg-slate-900">MP4 (Video 1080p)</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-[11px] font-medium text-slate-400 mb-1">Playlist Mode</label>
                                        <select value={playlist} onChange={e => setPlaylist(e.target.value)} className="w-full px-3 py-1.5 bg-black/50 border border-white/10 rounded-xl text-xs text-slate-200 focus:outline-none focus:border-blue-500">
                                            <option value="no" className="bg-slate-900">Single Video Only</option>
                                            <option value="yes" className="bg-slate-900">Entire Playlist</option>
                                        </select>
                                    </div>
                                </div>
                            )}

                            {(url.includes('list=') && !isSpotify) && (
                                <div>
                                    <label className="block text-[11px] font-medium text-slate-400 mb-1">Private Playlist Browser Cookies</label>
                                    <select value={browser} onChange={e => setBrowser(e.target.value)} className="w-full px-3 py-1.5 bg-black/50 border border-white/10 rounded-xl text-xs text-slate-200 focus:outline-none focus:border-blue-500">
                                        <option value="none" className="bg-slate-900">None / Public Link</option>
                                        <option value="chrome" className="bg-slate-900">Chrome Cookies</option>
                                        <option value="safari" className="bg-slate-900">Safari Cookies</option>
                                    </select>
                                </div>
                            )}

                            <div>
                                <label className="block text-[11px] font-medium text-slate-400 mb-1">Save Destination</label>
                                <input type="text" value={dest} onChange={e => setDest(e.target.value)} className="w-full px-3 py-1.5 bg-black/50 border border-white/10 rounded-xl text-[11px] text-slate-400 focus:outline-none focus:border-blue-500 truncate" />
                            </div>
                            
                            <button type="submit" className={`w-full mt-2 text-white text-sm font-medium px-5 py-2.5 rounded-xl shadow-lg transition-all cursor-pointer active:scale-[0.99] ${isSpotify ? 'bg-green-600 hover:bg-green-500 shadow-green-600/30' : 'bg-red-600 hover:bg-red-500 shadow-red-600/30'}`}>
                                Start {isSpotify ? 'Spotify' : 'YouTube'} Download
                            </button>
                        </form>
                    )}

                    {status === 'downloading' && (
                        <div className="mt-4 pt-4 border-t border-white/10 space-y-3 text-center py-4">
                            <div className="relative w-full bg-white/10 rounded-full h-2.5 overflow-hidden p-0.5">
                                <div className={`h-full rounded-full transition-all duration-300 shadow-lg ${isPaused ? 'bg-amber-500 shadow-amber-500/50' : (isSpotify ? 'bg-gradient-to-r from-green-400 to-emerald-600 shadow-green-500/50' : 'bg-gradient-to-r from-red-500 to-orange-500 shadow-red-500/50')}`} style={{ width: `${progress}%` }}></div>
                            </div>
                            <div className="flex justify-between items-center text-xs text-slate-300 px-1">
                                <span className="font-medium">{isPaused ? 'Paused' : 'Downloading & Transcoding...'}</span>
                                <span className="font-bold text-slate-200">{progress > 0 ? progress + '%' : ''}</span>
                            </div>
                            <p className="text-[11px] text-slate-400 font-mono truncate bg-black/40 p-2.5 rounded-xl border border-white/5">{logMessage}</p>
                            
                            <div className="flex items-center space-x-3 pt-3">
                                <button onClick={togglePause} className="flex-1 py-2 bg-slate-700 hover:bg-slate-600 font-medium rounded-xl transition text-xs text-white cursor-pointer">
                                    {isPaused ? '▶ Resume' : '⏸ Pause'}
                                </button>
                                <button onClick={cancelDownload} className="flex-1 py-2 bg-red-900/50 hover:bg-red-900/80 border border-red-500/30 font-medium rounded-xl transition text-xs text-red-400 cursor-pointer">
                                    ✕ Cancel
                                </button>
                            </div>
                        </div>
                    )}

                    {status === 'complete' && (
                        <div className="mt-4 pt-4 border-t border-white/10 space-y-4 text-center py-4">
                            <div className="w-12 h-12 bg-emerald-500/20 border border-emerald-500/40 rounded-full flex items-center justify-center mx-auto text-emerald-400">
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"></path></svg>
                            </div>
                            <div>
                                <p className="text-sm font-semibold text-white">Download Complete Successfully!</p>
                                <p className="text-xs text-slate-400 mt-0.5">{logMessage}</p>
                            </div>
                            
                            <div className="flex items-center space-x-3 pt-2">
                                <button onClick={openFolder} className="flex-1 py-2.5 bg-slate-700 hover:bg-slate-600 font-medium rounded-xl transition text-xs text-white cursor-pointer">
                                    📂 Open Folder
                                </button>
                                <button onClick={() => { setStatus('idle'); setUrl(''); setVideoInfo(null); }} className="flex-1 py-2.5 bg-blue-600 hover:bg-blue-500 font-medium rounded-xl transition text-xs text-white shadow-lg shadow-blue-600/30 cursor-pointer">
                                    + Download Another
                                </button>
                            </div>
                        </div>
                    )}

                    {status === 'error' && (
                        <div className="mt-4 pt-4 border-t border-white/10 space-y-4 text-center py-4">
                            <p className="text-sm font-semibold text-red-400">Download Error</p>
                            <p className="text-[11px] font-mono text-slate-400 bg-red-950/30 p-2 rounded-lg border border-red-900/50 break-words">{logMessage}</p>
                            <button onClick={() => setStatus('idle')} className="w-full py-2.5 bg-slate-800 hover:bg-slate-700 font-medium rounded-xl transition text-xs text-white">
                                Try Again
                            </button>
                        </div>
                    )}

                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
